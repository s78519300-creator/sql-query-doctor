name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  examples:
    name: sqldoctor on examples/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Clean example must pass
        run: sqldoctor check examples/06_weekly_retention_clean.sql --config examples/sqldoctor.json
      - name: Bad examples must fail with exit code 1
        run: |
          set +e
          sqldoctor check examples/*.sql --config examples/sqldoctor.json --color always
          code=$?
          set -e
          echo "sqldoctor exited with $code"
          test "$code" -eq 1
      - name: SARIF report
        run: sqldoctor check examples --config examples/sqldoctor.json --format sarif --output sqldoctor.sarif --fail-on never
      - uses: actions/upload-artifact@v4
        with:
          name: sqldoctor-sarif
          path: sqldoctor.sarif
